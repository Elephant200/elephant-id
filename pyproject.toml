[project]
name = "elephant-id"
version = "0.1.0"
description = "System for identifying individual elephants from photos using SEEK coding system."
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "numpy>=2.0.0",
    "opencv-python>=4.8.1.78",
    "pandas>=3.0.3",
    "pillow>=12.2.0",
    "pycocotools>=2.0.11",
    "tqdm>=4.67.3",
]

[project.scripts]
elephant-viz = "apps.visualization.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pre-commit>=4.6.0",
    "pytest>=9.0.3",
    "ruff>=0.11",
]
local = [
    "inference-sdk>=1.2.7",
    "python-dotenv>=1.2.2",
    "roboflow>=1.3.8",
]
visualization = [
    "flask>=3.1.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
exclude = ["legacy"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501", "SIM103"]

[tool.ruff.lint.isort]
known-first-party = ["elephant_id"]
