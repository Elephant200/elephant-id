[project]
name = "elephant-id"
version = "0.1.0"
description = "System for identifying individual elephants from photos using SEEK coding system."
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "numpy>=2.4.4",
    "opencv-python>=4.13.0.92",
    "pillow>=12.2.0",
    "pycocotools>=2.0.11",
    "tqdm>=4.67.3",
]

[project.optional-dependencies]
local = [
    "inference-sdk>=0.12.0",
    "pandas>=3.0.2",
    "roboflow>=1.3.8",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "ruff>=0.15.12",
]
visualization = [
    "flask>=3.1.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
