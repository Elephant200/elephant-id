[project]
name = "elephant-id"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "numpy>=2.4.4",
    "opencv-python>=4.13.0.92",
    "pandas>=3.0.2",
    "pycocotools>=2.0.11",
    "python-dotenv>=1.2.2",
    "requests>=2.33.1",
    "torch>=2.11.0",
    "torchvision>=0.26.0",
    "tqdm>=4.67.3",
]

[project.optional-dependencies]
roboflow = [
    "inference-sdk>=0.12.0",
    "roboflow>=1.3.8",
]
visualization = [
    "flask>=3.1.3",
    "pillow>=12.2.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "ruff>=0.15.12",
]
