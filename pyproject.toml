[project]
name = "elephant-id"
version = "0.1.0"
description = "Automated candidate-ranking algorithm for elephant re-identification."
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "coverage>=7.14.1",
    "loguru>=0.7.3",
    "matplotlib>=3.10.0",
    "numpy>=2.0.0",
    "opencv-python>=4.8.1.78",
    "pandas>=3.0.3",
    "pillow>=12.2.0",
    "pycocotools>=2.0.11",
    "scikit-learn>=1.6",
    "scipy>=1.13",
    "shapely>=2.1.2",
    "tqdm>=4.67.3",
]

[project.scripts]
eval = "elephant_id.evaluation.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pre-commit>=4.6.0",
    "pytest>=9.0.3",
    "ruff>=0.11",
]
local = [
    "albumentations>=2.0.8",
    "inference-sdk>=1.2.7",
    "python-dotenv>=1.2.2",
    "roboflow>=1.3.8",
    "timm>=1.0.27",
    "torch>=2.12.0",
    "torchvision>=0.27.0",
    "ultralytics>=8.4.51",
]
visualization = [
    "flask>=3.1.3",
]
api = [
    "fastapi>=0.115",
    "python-dotenv>=1.2.2",
    "python-multipart>=0.0.9",
    "uvicorn>=0.30",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning:pycocotools.*",
]

[tool.ruff]
exclude = ["legacy"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501", "SIM103"]

[tool.ruff.lint.isort]
known-first-party = ["elephant_id"]
