<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Matching Image Picker</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}" />
</head>
<body>

    <h1>Matching Image Picker</h1>
    <div id="scan-status" class="scan-status">Loading&hellip;</div>

</html>
